<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focas</title>
    <!-- Warm up connections early: Meta Pixel first (ad landing-page views depend on it) -->
    <link rel="preconnect" href="https://connect.facebook.net" crossorigin />
    <link rel="preconnect" href="https://www.facebook.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://vz-1b4abbd6-5f1.b-cdn.net" />
    <!-- Meta Pixel Code — kept first and inline so PageView fires as early as possible -->
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = true;
        n.version = "2.0";
        n.queue = [];
        t = b.createElement(e);
        t.async = true;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
      fbq("init", "525895529970374");
      fbq("track", "PageView");
    </script>
    <!-- End Meta Pixel Code -->
    <script>
      // Route-specific preload for each landing page's hero image (largest paint).
      (function () {
        var heroPosters = {
          "/rti": "/rti-assets/hero-poster.webp",
          "/manual": "/manual-assets/hero-poster.webp",
          "/mentor-counselling": "/mentor-assets/hero-poster.webp",
        };
        var href = heroPosters[location.pathname.replace(/\/$/, "")];
        if (!href) return;
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "image";
        l.href = href;
        l.fetchPriority = "high";
        document.head.appendChild(l);
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="description" content="Focas Make it Your Last Attempt" />
    <meta name="author" content="Focas" />
    <!-- Fonts as a <link> (not a CSS @import) so they download in parallel with the app CSS -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
    />
    <!-- Google Tag Manager + Google tag: loaded early and async, exactly as before.
         (Deferring them until after page load made GA intermittently drop the
         app's gtag("event", ...) calls — purchase/lead events — so they stay here.
         Both are async, so they don't block rendering.) -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-KLWVWF75");
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-F407NDL1PR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-F407NDL1PR");

      // Razorpay Checkout: loaded after the page has loaded (it's only needed
      // once a form is filled), so it doesn't block the first paint.
      // Until it arrives, window.Razorpay is a small stand-in with the same API
      // (new Razorpay(options), .on(), .open()): if someone presses Pay before the
      // real script has loaded (slow network), it loads it right away and then
      // opens the real checkout with the same options and handlers.
      (function () {
        var promise = null;
        function loadRazorpay() {
          if (!promise) {
            promise = new Promise(function (resolve, reject) {
              var s = document.createElement("script");
              s.async = true;
              s.src = "https://checkout.razorpay.com/v1/checkout.js";
              s.onload = function () { resolve(window.Razorpay); };
              s.onerror = function () { promise = null; s.remove(); reject(new Error("Razorpay failed to load")); };
              document.head.appendChild(s);
            });
          }
          return promise;
        }
        function RazorpayPending(options) {
          var handlers = [];
          this.on = function (event, fn) { handlers.push([event, fn]); return this; };
          this.open = function () {
            loadRazorpay().then(
              function (Real) {
                var rzp = new Real(options);
                handlers.forEach(function (h) { rzp.on(h[0], h[1]); });
                rzp.open();
              },
              function () {
                alert("Payment could not load. Please check your internet connection and try again.");
                if (options && options.modal && typeof options.modal.ondismiss === "function") options.modal.ondismiss();
              }
            );
          };
        }
        window.Razorpay = RazorpayPending;
        window.loadRazorpay = loadRazorpay;
        function schedule() {
          var start = function () { loadRazorpay().catch(function () {}); };
          if (typeof window.requestIdleCallback === "function") window.requestIdleCallback(start, { timeout: 2000 });
          else setTimeout(start, 1);
        }
        if (document.readyState === "complete") schedule();
        else window.addEventListener("load", schedule);
      })();
    </script>
  </head>
